name: Docs (Sphinx)

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group docs

      - name: Build docs
        env:
          SPHINX_HTML_THEME: furo
        run: |
          sphinx-build -b html docs docs/_build/html -W --keep-going

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-html
          path: docs/_build/html
          if-no-files-found: error

      - name: Trigger Read the Docs build (optional)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
          READTHEDOCS_PROJECT_SLUG: ${{ secrets.READTHEDOCS_PROJECT_SLUG }}
          READTHEDOCS_VERSION: ${{ secrets.READTHEDOCS_VERSION }}
        run: |
          set -euo pipefail
          if [[ -z "${READTHEDOCS_TOKEN:-}" || -z "${READTHEDOCS_PROJECT_SLUG:-}" ]]; then
            echo "Skipping RTD trigger: READTHEDOCS_TOKEN/READTHEDOCS_PROJECT_SLUG not set"
            exit 0
          fi
          version="${READTHEDOCS_VERSION:-latest}"
          echo "Triggering RTD build: project=${READTHEDOCS_PROJECT_SLUG} version=${version}"
          curl -fsS -X POST \
            -H "Authorization: Token ${READTHEDOCS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://readthedocs.org/api/v3/projects/${READTHEDOCS_PROJECT_SLUG}/versions/${version}/builds/" \
            -d '{}'
